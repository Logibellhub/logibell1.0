<style>
  html, body { margin: 0; padding: 0; background: var(--surface-page); scroll-behavior: smooth; }

  .lb-wrap { max-width: var(--container-max); margin: 0 auto; padding-left: 32px; padding-right: 32px; }

  /* ---- Services tabs (single-panel) ----

  .lb-svc-tabbar { display: flex; align-items: center; gap: 4px; background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 7px; box-shadow: var(--shadow-sm); }

  @media (prefers-reduced-motion: reduce) {

  /* ---- Flip cards (services preview + pricing tiers) ----
     3D Y-flip, 560ms; both faces share one grid cell so the container
     sizes to the taller face (no layout shift). Each face rotates
     Standard inner-rotation 3D model: the inner element rotates 180°, faces
     stacked in one grid cell with backface-visibility hidden.
     Reduced motion → cross-fade. */
  .lb-flip { cursor: pointer; border-radius: var(--radius-xl); perspective: 1200px; transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
  .lb-flip:focus-visible { outline: 2px solid var(--gold-600); outline-offset: 3px; }
  .lb-flip-lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .lb-flip-inner { position: relative; display: grid; height: 100%; transform-style: preserve-3d; transition: transform 560ms cubic-bezier(0.4, 0, 0.2, 1); }
  .lb-flip.is-flipped .lb-flip-inner { transform: rotateY(180deg); }
  .lb-flip-face { grid-area: 1 / 1; position: relative; min-width: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .lb-flip-face > *:first-child { height: 100%; box-sizing: border-box; }
  .lb-flip-back { transform: rotateY(180deg); }
  .lb-flip-aff { position: absolute; bottom: 14px; right: 14px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: var(--radius-pill); font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; line-height: 1; background: rgba(25,57,96,0.06); color: var(--navy-700); border: 1px solid transparent; transition: background 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out); pointer-events: none; z-index: 2; white-space: nowrap; }
  .lb-flip-aff .lb-aff-ic { display: inline-flex; }
  .lb-flip:hover .lb-flip-aff, .lb-flip:focus-visible .lb-flip-aff { background: rgba(255,203,31,0.18); color: var(--gold-700); border-color: rgba(255,203,31,0.55); }
  .lb-flip-aff--dark { background: rgba(255,255,255,0.10); color: var(--on-navy-soft); }
  .lb-flip:hover .lb-flip-aff--dark, .lb-flip:focus-visible .lb-flip-aff--dark { background: rgba(255,203,31,0.18); color: var(--gold-500); border-color: rgba(255,203,31,0.5); }
  /* cards whose inner content has a full-width CTA at the bottom reserve a band for the pill */
  .lb-flip-reserve .lb-flip-face > *:first-child { padding-bottom: 56px !important; }
  @media (prefers-reduced-motion: no-preference) {
    .lb-flip.lb-aff-nudge .lb-aff-ic { animation: lbAffWobble 700ms var(--ease-out) 1; transform-origin: 50% 50%; }
    @keyframes lbAffWobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-20deg); } 55% { transform: rotate(14deg); } 80% { transform: rotate(-6deg); } }
  }
  @media (prefers-reduced-motion: reduce) {
    .lb-flip { transition: none; }
    .lb-flip-lift:hover { transform: none; }
    .lb-flip-inner { transition: none; transform: none !important; }
    .lb-flip-face { backface-visibility: visible; -webkit-backface-visibility: visible; transition: opacity 180ms ease, visibility 0s; }
    .lb-flip-back { transform: none; opacity: 0; visibility: hidden; }
    .lb-flip-front { opacity: 1; visibility: visible; }
    .lb-flip.is-flipped .lb-flip-front { opacity: 0; visibility: hidden; transition: opacity 180ms ease, visibility 0s 180ms; }
    .lb-flip.is-flipped .lb-flip-back { opacity: 1; visibility: visible; transition: opacity 180ms ease, visibility 0s; }
  }

  /* ---- Ambient background layers (atmosphere pass) ---- */
  .lb-amb { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
  .lb-drift { position: absolute; border-radius: 50%; }
  @media (prefers-reduced-motion: no-preference) {
    .lb-drift { will-change: transform; }
    .lb-drift-1 { animation: lbDrift1 72s ease-in-out infinite alternate; }
    .lb-drift-2 { animation: lbDrift2 86s ease-in-out infinite alternate; }
    .lb-drift-3 { animation: lbDrift3 64s ease-in-out infinite alternate; }
    @keyframes lbDrift1 { from { transform: translate(0, 0); } to { transform: translate(70px, -48px); } }
    @keyframes lbDrift2 { from { transform: translate(0, 0); } to { transform: translate(-60px, 42px); } }
    @keyframes lbDrift3 { from { transform: translate(0, 0); } to { transform: translate(44px, 60px); } }
  }

  /* ---- Scroll reveal (applied by App.jsx; transform/opacity only — no CLS) ---- */
  @media (prefers-reduced-motion: no-preference) {
    .lb-reveal { opacity: 0; transform: translateY(24px); transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out); transition-delay: var(--rv-delay, 0ms); }
    .lb-reveal.is-in { opacity: 1; transform: none; }
  }
  @media print { .lb-reveal { opacity: 1 !important; transform: none !important; } }

  /* ---- Brand intro (logo reveal) ----------------------------------------
     The LogiBell mark centered in a thin circular ring that draws itself,
     the wordmark beneath, a gold underline sweep, and the tagline — all
     crisp vector/native assets. Closes with a smooth scale-and-fade into
     the homepage (no hard cut). Plays on first load and when returning
     Home via the logo; reduced-motion shows the finished lockup briefly. */
  #lb-intro { position: fixed; inset: 0; z-index: 999; display: none; align-items: center; justify-content: center;
    background: radial-gradient(125% 125% at 50% 43%, #FFFFFF 0%, #FFFFFF 55%, #EAEFF6 100%);
    opacity: 0; transition: opacity 480ms cubic-bezier(0.4,0,0.2,1); }
  #lb-intro.is-on { opacity: 1; }
  #lb-intro.is-hidden { opacity: 0; pointer-events: none;
    transition: opacity 780ms cubic-bezier(0.55,0,0.3,1); }
  .lb-intro-stage { display: flex; flex-direction: column; align-items: center; padding: 0 18px;
    transition: transform 780ms cubic-bezier(0.55,0,0.3,1), opacity 620ms cubic-bezier(0.55,0,0.3,1); }
  #lb-intro.is-hidden .lb-intro-stage { transform: scale(1.06) translateY(-12px); opacity: 0; }
  .lb-intro-circle { position: relative; width: clamp(168px, 24vw, 248px); aspect-ratio: 1; }
  .lb-intro-circle svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .lb-intro-ringpath { stroke-dasharray: 610; stroke-dashoffset: 0; }
  .lb-intro-mark { position: absolute; left: 50%; top: 50%; width: 58%; height: 58%; transform: translate(-50%,-50%); object-fit: contain; }
  .lb-intro-word { height: clamp(34px, 5vw, 52px); width: auto; max-width: 72vw; object-fit: contain; display: block; margin-top: clamp(24px, 4vh, 38px); }
  .lb-intro-underline { width: clamp(56px, 7vw, 84px); height: 3px; border-radius: 3px; margin-top: clamp(16px, 2.6vh, 24px);
    background: linear-gradient(90deg, var(--gold-500), var(--gold-400)); transform-origin: center; }
  .lb-intro-tag { margin-top: 16px; text-align: center;
    font-family: var(--font-sans); font-size: clamp(12px, 1.4vw, 14px); font-weight: 600; letter-spacing: 2.6px; text-transform: uppercase;
    color: var(--text-muted); }

  @media (prefers-reduced-motion: no-preference) {
    #lb-intro.is-playing .lb-intro-ringpath { stroke-dashoffset: 610; animation: lbRingDraw 1150ms cubic-bezier(0.55,0.08,0.25,1) 120ms forwards; }
    #lb-intro.is-playing .lb-intro-mark { opacity: 0; transform: translate(-50%,-50%) scale(0.9); animation: lbMarkIn 700ms cubic-bezier(0.34,1.3,0.45,1) 430ms forwards; }
    #lb-intro.is-playing .lb-intro-word { opacity: 0; transform: translateY(10px); animation: lbWordIn 620ms cubic-bezier(0.22,0.6,0.36,1) 820ms forwards; }
    #lb-intro.is-playing .lb-intro-underline { transform: scaleX(0); animation: lbUnderIn 480ms cubic-bezier(0.4,0,0.2,1) 1150ms forwards; }
    #lb-intro.is-playing .lb-intro-tag { opacity: 0; transform: translateY(8px); animation: lbTagIn 560ms cubic-bezier(0.22,0.6,0.36,1) 1320ms forwards; }
    @keyframes lbRingDraw { to { stroke-dashoffset: 0; } }
    @keyframes lbMarkIn { to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes lbWordIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes lbUnderIn { to { transform: scaleX(1); } }
    @keyframes lbTagIn { to { opacity: 1; transform: translateY(0); } }
  }
  body.lb-intro-lock { overflow: hidden; }

  /* ---- Back to top ------------------------------------------------------- */
  .lb-back-top { position: fixed; right: clamp(18px, 3vw, 34px); bottom: clamp(18px, 3vw, 34px); z-index: 60;
    width: 58px; height: 58px; border-radius: 16px; border: 1px solid var(--navy-700);
    background: var(--navy-800); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    cursor: pointer; box-shadow: 0 10px 26px rgba(25,57,96,0.28); padding: 0;
    opacity: 0; visibility: hidden; transform: translateY(14px) scale(0.92);
    transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out), background 180ms var(--ease-out), border-color 180ms var(--ease-out); }
  .lb-back-top.is-on { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .lb-back-top:hover { background: var(--navy-900); border-color: var(--gold-500); transform: translateY(-2px) scale(1); }
  .lb-back-top:hover svg, .lb-back-top:hover .lb-back-top-label { color: var(--gold-500); }
  .lb-back-top:focus-visible { outline: 2px solid var(--gold-600); outline-offset: 3px; }
  .lb-back-top svg { color: #fff; transition: color 180ms var(--ease-out); margin-top: 1px; }
  .lb-back-top-label { font-family: var(--font-sans); font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #fff; line-height: 1; transition: color 180ms var(--ease-out); }
  @media (max-width: 760px) { .lb-back-top { width: 52px; height: 52px; border-radius: 14px; } }
  @media (prefers-reduced-motion: reduce) { .lb-back-top { transition: opacity 200ms linear, visibility 200ms linear; transform: none; } .lb-back-top:hover { transform: none; } }

  /* ---- Load board ---- */
  .lb-live-dot { box-shadow: 0 0 0 0 rgba(31,138,91,0.5); }
  @media (prefers-reduced-motion: no-preference) {
    .lb-live-dot { animation: lbPulse 2s var(--ease-out) infinite; }
    @keyframes lbPulse { 0% { box-shadow: 0 0 0 0 rgba(31,138,91,0.5); } 70% { box-shadow: 0 0 0 7px rgba(31,138,91,0); } 100% { box-shadow: 0 0 0 0 rgba(31,138,91,0); } }
    .lb-lane-row { opacity: 0; animation: lbRowIn 460ms var(--ease-out) forwards; }
    @keyframes lbRowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  }

<script>
(function () {
  var intro = document.getElementById('lb-intro');
  if (!intro) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = false, dismissT = null, hideT = null;
  var HOLD = reduce ? 1000 : 3150; // full reveal + a settled beat before the close begins

  function dismiss() {
    if (!playing) return;
    playing = false;
    clearTimeout(dismissT);
    intro.classList.remove('is-on');
    intro.classList.add('is-hidden'); // stage scales/fades, then the curtain lifts — no hard cut
    document.body.classList.remove('lb-intro-lock');
    hideT = setTimeout(function () {
      intro.style.display = 'none';
      intro.classList.remove('is-hidden', 'is-playing');
    }, 820);
  }

  function play() {
    clearTimeout(hideT); clearTimeout(dismissT);
    intro.classList.remove('is-hidden', 'is-playing', 'is-on');
    intro.style.display = 'flex';
    void intro.offsetWidth; // reflow so animations restart cleanly on replay
    if (!reduce) intro.classList.add('is-playing');
    // add is-on a frame after the display flip so the opacity transition reliably runs
    requestAnimationFrame(function () { requestAnimationFrame(function () { intro.classList.add('is-on'); }); });
    document.body.classList.add('lb-intro-lock');
    playing = true;
    dismissT = setTimeout(dismiss, HOLD);
  }

  window.__lbPlayIntro = play;

  // First load: play only when landing on the Home page.
  var slug = (window.location.hash || '').replace(/^#\/?/, '').split('/')[0];
  if (slug === '' || slug === 'home') play();
})();
</script>
